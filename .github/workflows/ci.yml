name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:

jobs:
  verificacao:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
