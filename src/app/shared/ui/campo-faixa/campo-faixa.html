<div
  role="group"
  [attr.aria-labelledby]="idRotulo"
  [formGroup]="grupo()"
  class="flex flex-col gap-1.5"
>
  <span [id]="idRotulo" class="rotulo">{{ rotulo() }}</span>

  <div class="grid grid-cols-2 gap-2.5 sm:gap-[10px]">
    <div class="flex flex-col gap-1">
      <label [for]="idDe" class="text-[11px] text-muted">De</label>
      <div class="relative">
        @if (prefixo(); as simbolo) {
          <span
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] font-medium text-petrol-700"
            aria-hidden="true"
          >
            {{ simbolo }}
          </span>
        }
        <!--
          O tipo do input é fixo em cada ramo de propósito: o Angular escolhe o
          NumberValueAccessor pelo seletor input[type=number], e com o tipo vindo
          de um binding o controle receberia texto em vez de número.
        -->
        @if (tipo() === 'data') {
          <input
            [id]="idDe"
            type="date"
            formControlName="de"
            class="campo"
            [attr.aria-invalid]="estado.comErro() || null"
            [attr.aria-describedby]="estado.mensagem() ? idErro : null"
          />
        } @else {
          <input
            [id]="idDe"
            type="number"
            [attr.step]="passo()"
            [placeholder]="exemploDe() ?? ''"
            formControlName="de"
            class="campo"
            [class.pl-9]="prefixo()"
            [attr.aria-invalid]="estado.comErro() || null"
            [attr.aria-describedby]="estado.mensagem() ? idErro : null"
          />
        }
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label [for]="idAte" class="text-[11px] text-muted">Até</label>
      <div class="relative">
        @if (prefixo(); as simbolo) {
          <span
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] font-medium text-petrol-700"
            aria-hidden="true"
          >
            {{ simbolo }}
          </span>
        }
        @if (tipo() === 'data') {
          <input
            [id]="idAte"
            type="date"
            formControlName="ate"
            class="campo"
            [attr.aria-invalid]="estado.comErro() || null"
            [attr.aria-describedby]="estado.mensagem() ? idErro : null"
          />
        } @else {
          <input
            [id]="idAte"
            type="number"
            [attr.step]="passo()"
            [placeholder]="exemploAte() ?? ''"
            formControlName="ate"
            class="campo"
            [class.pl-9]="prefixo()"
            [attr.aria-invalid]="estado.comErro() || null"
            [attr.aria-describedby]="estado.mensagem() ? idErro : null"
          />
        }
      </div>
    </div>
  </div>

  @if (estado.mensagem(); as texto) {
    <p
      [id]="idErro"
      role="alert"
      class="flex items-center gap-1.5 text-[12.5px] font-medium text-danger"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="size-[13px] shrink-0"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v4m0 4h.01" />
      </svg>
      {{ texto }}
    </p>
  }
</div>
