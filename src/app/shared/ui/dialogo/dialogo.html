<dialog
  #dialogo
  [attr.aria-labelledby]="idTitulo"
  (close)="aoFecharNativo()"
  class="m-auto hidden max-h-[calc(100vh-4rem)] w-[calc(100vw-2rem)] flex-col rounded-2xl border-0 bg-white p-0 text-petrol-900 outline-none shadow-[0_24px_64px_-16px_rgba(11,46,51,0.45)] backdrop:bg-petrol-900/45 open:flex"
  [style.max-width]="larguraMaxima()"
>
  @if (aberto()) {
    <header
      class="flex shrink-0 items-center justify-between gap-4 border-b border-petrol-900/[0.08] px-7 py-[18px]"
    >
      <h2 [id]="idTitulo" class="font-display text-[17px] font-semibold">{{ titulo() }}</h2>

      <button
        type="button"
        class="grid size-[34px] shrink-0 place-items-center rounded-lg text-petrol-700 transition-colors hover:bg-petrol-900/[0.06] hover:text-petrol-900 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-500"
        aria-label="Fechar"
        (click)="dialogo.close()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          class="size-[17px]"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="relative min-h-0 grow overflow-y-auto px-8 py-[26px]">
      <ng-content />
    </div>

    <footer
      class="shrink-0 border-t border-petrol-900/10 px-7 py-4 shadow-[0_-8px_16px_-12px_rgba(11,46,51,0.18)]"
    >
      <ng-content select="[rodape]" />
    </footer>
  }
</dialog>
