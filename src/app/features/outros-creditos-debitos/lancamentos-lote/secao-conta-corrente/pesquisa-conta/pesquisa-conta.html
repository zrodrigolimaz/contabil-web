<app-dialogo
  [aberto]="aberto()"
  titulo="Pesquisa Conta Corrente"
  larguraMaxima="42rem"
  (fechar)="fechar.emit()"
>
  <div class="flex flex-col gap-4">
    <!-- Div, e não form: este diálogo vive dentro do formulário do lançamento, e um
         submit daqui chegaria lá como pedido de inclusão. -->
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex flex-col gap-1.5">
        <span class="eyebrow">Campo de busca</span>
        <select
          class="campo campo-select w-44"
          [value]="campo()"
          (change)="trocarCampo($event)"
          aria-label="Campo de busca"
        >
          @for (opcao of campos; track opcao.valor) {
            <option [value]="opcao.valor">{{ opcao.rotulo }}</option>
          }
        </select>
      </label>

      <label class="flex min-w-52 flex-1 flex-col gap-1.5">
        <span class="eyebrow">Valor</span>
        <input
          type="text"
          class="campo"
          autocomplete="off"
          [value]="valor()"
          (input)="trocarValor($event)"
          (keydown.enter)="$event.preventDefault(); listar()"
        />
      </label>

      <button type="button" class="btn btn-primario" [disabled]="carregando()" (click)="listar()">
        Listar
      </button>
    </div>

    <div class="overflow-x-auto rounded-lg border border-petrol-900/[0.12]">
      <table class="w-full border-collapse text-left text-[12.5px] text-petrol-900">
        <caption class="sr-only">
          Contas correntes encontradas
        </caption>

        <thead
          class="bg-petrol-900 text-[10.5px] font-semibold uppercase tracking-[0.04em] text-white/95"
        >
          <tr>
            <th scope="col" class="w-10 px-3 py-2.5">
              <span class="sr-only">Selecionar</span>
            </th>
            <th scope="col" class="whitespace-nowrap px-3 py-2.5">Conta Corrente</th>
            <th scope="col" class="px-3 py-2.5">Titular</th>
            <th scope="col" class="whitespace-nowrap px-3 py-2.5">Agência</th>
          </tr>
        </thead>

        <tbody [attr.aria-busy]="carregando() ? 'true' : null">
          @if (carregando()) {
            <tr>
              <td colspan="4" class="px-3 py-10 text-center text-[13px] text-petrol-700/70">
                Consultando contas…
              </td>
            </tr>
          } @else {
            @for (conta of resultado().itens; track conta.numero) {
              <tr
                class="cursor-pointer border-b border-petrol-900/[0.07] transition-colors last:border-b-0 odd:bg-petrol-900/[0.015] hover:bg-primary-50/40"
                [class.bg-primary-50]="marcada()?.numero === conta.numero"
                (click)="alternar(conta)"
              >
                <td class="px-3 py-2.5">
                  <input
                    type="radio"
                    name="conta-marcada"
                    class="size-4 cursor-pointer accent-primary-600"
                    [attr.aria-label]="'Selecionar conta ' + conta.numero"
                    [checked]="marcada()?.numero === conta.numero"
                    (click)="$event.stopPropagation(); alternar(conta)"
                  />
                </td>
                <td class="px-3 py-2.5 font-semibold tabular-nums">{{ conta.numero }}</td>
                <td class="px-3 py-2.5">{{ conta.titular }}</td>
                <td class="px-3 py-2.5 tabular-nums">{{ conta.agencia }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="4" class="px-3 py-10 text-center text-[13px] text-petrol-700/70">
                  Nenhum registro encontrado.
                </td>
              </tr>
            }
          }
        </tbody>
      </table>

      <app-paginacao
        [pagina]="resultado().pagina"
        [totalPaginas]="resultado().totalPaginas"
        [total]="resultado().total"
        [tamanhoPagina]="resultado().tamanhoPagina"
        (irPara)="irPara($event)"
      />
    </div>
  </div>

  <div rodape class="flex items-center justify-end gap-2">
    <button type="button" class="btn btn-contorno" (click)="fechar.emit()">Fechar</button>

    <button
      type="button"
      class="btn btn-primario"
      [disabled]="marcada() === null"
      (click)="confirmar()"
    >
      OK
    </button>
  </div>
</app-dialogo>
