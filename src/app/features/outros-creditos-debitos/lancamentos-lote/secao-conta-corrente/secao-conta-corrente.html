<fieldset class="min-w-0 border-0 p-0" [formGroup]="grupo()">
  <legend class="sr-only">Conta Corrente</legend>

  <div class="mb-[18px] flex items-center gap-3">
    <span class="eyebrow" aria-hidden="true">Conta Corrente</span>
    <span class="regua"></span>
  </div>

  <div class="mb-[18px] grid gap-x-7 gap-y-[18px] sm:grid-cols-2 lg:grid-cols-3">
    <app-campo-form
      rotulo="Conta Corrente"
      paraId="lancamento-conta"
      [controle]="grupo().controls.conta"
      [obrigatorio]="!leitura()"
    >
      <div class="flex items-center gap-2.5">
        <input
          id="lancamento-conta"
          type="text"
          [appDigitos]="10"
          class="campo"
          formControlName="conta"
        />

        <button
          type="button"
          class="btn btn-contorno size-[38px] shrink-0 px-0"
          aria-label="Pesquisar conta corrente"
          [disabled]="desabilitado()"
          (click)="pesquisaAberta.set(true)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            class="size-[15px]"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </button>
      </div>
    </app-campo-form>

    @if (titular(); as nome) {
      <p
        class="col-span-full flex h-[38px] w-fit max-w-full items-center gap-2 self-end rounded-lg border border-primary-200 bg-primary-50 px-3.5 text-[13px] font-semibold text-primary-800 lg:col-span-2"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-[15px] shrink-0"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span class="truncate">{{ nome }}</span>
      </p>
    }
  </div>

  <div class="mb-[18px] grid gap-x-7 gap-y-[18px] sm:grid-cols-2 lg:grid-cols-3">
    <app-campo-form
      rotulo="Valor"
      paraId="lancamento-valor"
      [controle]="grupo().controls.valor"
      [obrigatorio]="!leitura()"
    >
      <div class="relative">
        <span
          class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[13px] font-medium text-petrol-700"
        >
          R$
        </span>
        <input
          id="lancamento-valor"
          type="text"
          appMoeda
          class="campo pl-9"
          formControlName="valor"
          placeholder="0,00"
        />
      </div>
    </app-campo-form>

    <app-campo-form
      rotulo="Histórico"
      paraId="lancamento-historico"
      [controle]="grupo().controls.historico"
      [obrigatorio]="!leitura()"
    >
      <select id="lancamento-historico" class="campo campo-select" formControlName="historico">
        <option value="">Selecione</option>
        @for (opcao of historicos; track opcao) {
          <option [value]="opcao">{{ opcao }}</option>
        }
      </select>
    </app-campo-form>

    <app-campo-form
      rotulo="Documento"
      paraId="lancamento-documento"
      [controle]="grupo().controls.documento"
      [obrigatorio]="!leitura()"
    >
      <input
        id="lancamento-documento"
        type="text"
        [appDigitos]="12"
        class="campo"
        formControlName="documento"
      />
    </app-campo-form>
  </div>

  <label class="mb-[18px] flex w-fit items-center gap-2.5 text-sm text-petrol-900">
    <input type="checkbox" formControlName="estorno" class="caixa disabled:opacity-50" />
    Estorno
  </label>

  <div class="grid gap-x-7 gap-y-[18px] sm:grid-cols-2 lg:grid-cols-3">
    <app-campo-form
      class="sm:col-span-2"
      rotulo="Descrição"
      paraId="lancamento-descricao"
      [controle]="grupo().controls.descricao"
    >
      <textarea
        id="lancamento-descricao"
        rows="3"
        class="campo h-auto py-2.5 leading-relaxed"
        formControlName="descricao"
      ></textarea>
    </app-campo-form>

    <app-campo-form rotulo="Situação" paraId="lancamento-situacao">
      <div class="relative">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="pointer-events-none absolute left-3 top-1/2 size-[13px] -translate-y-1/2 text-hint"
          aria-hidden="true"
        >
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <input
          id="lancamento-situacao"
          type="text"
          class="campo campo-leitura"
          [value]="situacao()"
          readonly
          tabindex="-1"
        />
      </div>
      <p class="text-xs text-muted">Somente leitura</p>
    </app-campo-form>
  </div>
</fieldset>

<app-pesquisa-conta
  [aberto]="pesquisaAberta()"
  (escolher)="escolherConta($event)"
  (fechar)="pesquisaAberta.set(false)"
/>
