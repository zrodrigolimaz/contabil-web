<div class="flex flex-col gap-[18px]">
  <app-filtros-lotes [carregando]="carregando()" (pesquisar)="pesquisar($event)" />

  @if (erro(); as mensagem) {
    <div class="cartao">
      <div class="flex flex-col items-center gap-2 px-6 py-14 text-center">
        <div
          class="mb-1 grid size-11 place-items-center rounded-full bg-danger-50 text-danger"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-5"
          >
            <path
              d="m10.3 3.9-8.2 14A2 2 0 0 0 3.8 21h16.4a2 2 0 0 0 1.7-3.1l-8.2-14a2 2 0 0 0-3.4 0Z"
            />
            <path d="M12 9v4m0 4h.01" />
          </svg>
        </div>

        <p class="font-display text-[15px] font-semibold text-petrol-900">
          Não foi possível carregar os lotes
        </p>
        <p class="max-w-sm text-[13px] leading-relaxed text-muted" role="alert">{{ mensagem }}</p>

        <button
          type="button"
          class="btn btn-contorno mt-1.5 h-[34px] gap-2 px-3.5 text-[13px]"
          [disabled]="carregando()"
          (click)="tentarNovamente()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-3.5"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          Tentar novamente
        </button>
      </div>
    </div>
  } @else if (pesquisou()) {
    <div class="cartao px-4 py-3">
      <app-barra-acoes
        [selecionados]="lotesSelecionados()"
        [executando]="executando()"
        (acionar)="acionar($event)"
        (limparSelecao)="limparSelecao()"
      />
    </div>

    @if (aviso(); as resultado) {
      <p
        class="flex items-center gap-2 rounded-xl border px-4 py-2.5 text-[12.5px] font-medium"
        [class]="
          resultado.tom === 'sucesso'
            ? 'border-primary-200 bg-primary-50 text-primary-800'
            : 'border-petrol-900/10 bg-white text-petrol-700'
        "
        role="status"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4 shrink-0"
          aria-hidden="true"
        >
          @if (resultado.tom === 'sucesso') {
            <path d="m4 12 5 5L20 6" />
          } @else {
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5M12 8h.01" />
          }
        </svg>
        {{ resultado.texto }}
      </p>
    }

    <div class="cartao">
      <app-tabela-lotes
        [lotes]="lotes()"
        [carregando]="carregando()"
        [selecionados]="idsSelecionados()"
        [ordenacao]="ordenacao()"
        (alternarSelecao)="alternarSelecao($event)"
        (alternarTodos)="alternarTodos($event)"
        (ordenar)="ordenarPor($event)"
      />

      <app-paginacao
        [pagina]="pagina()"
        [totalPaginas]="totalPaginas()"
        [total]="total() ?? 0"
        [tamanhoPagina]="tamanhoPagina()"
        (irPara)="irPara($event)"
      />
    </div>
  } @else if (carregando()) {
    <div class="cartao">
      <div class="flex justify-center px-6 py-16">
        <p class="flex items-center gap-2 text-[13px] text-muted" role="status" aria-live="polite">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            class="size-4 animate-spin text-primary-600 motion-reduce:animate-none"
            aria-hidden="true"
          >
            <path d="M12 3a9 9 0 1 0 9 9" />
          </svg>
          Consultando lotes…
        </p>
      </div>
    </div>
  }
</div>

<app-dialogo-justificativa
  [lote]="justificativaAberta()"
  (fechar)="justificativaAberta.set(null)"
/>

<app-dialogo-confirmacao
  [pedido]="pedido()"
  (confirmar)="confirmarPedido()"
  (cancelar)="cancelarPedido()"
/>

<app-lancamentos-lote
  [modo]="modoLancamentos()"
  [lote]="loteDosLancamentos()"
  (fechar)="fecharLancamentos($event)"
/>
