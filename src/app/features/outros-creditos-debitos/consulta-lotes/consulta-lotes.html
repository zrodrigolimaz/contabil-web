<div class="flex flex-col gap-4">
  <app-filtros-lotes [carregando]="carregando()" (pesquisar)="pesquisar($event)" />

  <div class="cartao">
    @if (erro(); as mensagem) {
      <div class="flex justify-center px-6 py-16">
        <p
          class="flex items-center gap-2 rounded-md border border-danger/25 bg-danger/5 px-4 py-2.5 text-[13px] font-medium text-danger"
          role="alert"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
            aria-hidden="true"
          >
            <path d="M12 9v4M12 17h.01" />
            <path
              d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"
            />
          </svg>
          {{ mensagem }}
        </p>
      </div>
    } @else if (pesquisou()) {
      <div class="border-b border-petrol-900/[0.1] px-6 py-3">
        <app-barra-acoes
          [selecionados]="lotesSelecionados()"
          [executando]="executando()"
          (acionar)="acionar($event)"
          (limparSelecao)="limparSelecao()"
        />
      </div>

      @if (aviso(); as resultado) {
        <p
          class="flex items-center gap-2 border-b border-petrol-900/[0.07] px-6 py-2.5 text-[12.5px] font-medium"
          [class]="
            resultado.tom === 'sucesso'
              ? 'bg-primary-50/60 text-primary-700'
              : 'bg-petrol-900/[0.03] text-petrol-700'
          "
          role="status"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
            aria-hidden="true"
          >
            @if (resultado.tom === 'sucesso') {
              <path d="m4 12 5 5L20 6" />
            } @else {
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" />
            }
          </svg>
          {{ resultado.texto }}
        </p>
      }

      <app-tabela-lotes
        [lotes]="lotes()"
        [carregando]="carregando()"
        [selecionados]="idsSelecionados()"
        (alternarSelecao)="alternarSelecao($event)"
        (alternarTodos)="alternarTodos($event)"
      />

      <app-paginacao
        [pagina]="pagina()"
        [totalPaginas]="totalPaginas()"
        [total]="total() ?? 0"
        [tamanhoPagina]="tamanhoPagina()"
        (irPara)="irPara($event)"
      />
    } @else if (carregando()) {
      <div class="flex justify-center px-6 py-16">
        <p class="flex items-center gap-2 text-[13px] text-petrol-700/80" role="status">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            class="size-4 animate-spin text-primary-600 motion-reduce:animate-none"
            aria-hidden="true"
          >
            <path d="M12 3a9 9 0 1 0 9 9" />
          </svg>
          Consultando lotes…
        </p>
      </div>
    } @else {
      <div class="flex flex-col items-center gap-2 px-6 py-16 text-center">
        <p class="text-[13px] font-semibold text-petrol-900">Nenhuma pesquisa realizada</p>
        <p class="max-w-sm text-[13px] text-petrol-700/70">
          Ajuste os filtros acima e clique em Pesquisar para listar os lotes.
        </p>
      </div>
    }
  </div>
</div>

<app-dialogo-justificativa
  [lote]="justificativaAberta()"
  (fechar)="justificativaAberta.set(null)"
/>

<app-dialogo-confirmacao
  [pedido]="pedido()"
  (confirmar)="confirmarPedido()"
  (cancelar)="cancelarPedido()"
/>

<app-lancamentos-lote
  [modo]="modoLancamentos()"
  [lote]="loteDosLancamentos()"
  (fechar)="fecharLancamentos($event)"
/>
