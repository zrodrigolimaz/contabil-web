<app-painel-recolhivel titulo="Filtros" subtitulo="Pesquisar lote outros créditos/débitos">
  <div resumo class="contents">
    @for (chip of chips(); track chip.chave) {
      <span class="chip h-7 px-3 text-[12.5px] font-medium">{{ chip.texto }}</span>
    }

    @if (chips().length > 0) {
      <button
        type="button"
        class="rounded px-1 text-[12.5px] font-medium text-primary-700 transition-colors hover:text-primary-800 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
        (click)="limpar()"
      >
        Limpar tudo
      </button>
    }
  </div>

  <form [formGroup]="form" (ngSubmit)="aoEnviar()">
    <div class="grid items-start gap-x-7 gap-y-[18px] md:grid-cols-2 xl:grid-cols-3">
      <app-campo-form rotulo="Instituição Resp." paraId="filtro-instituicao-responsavel">
        <select
          id="filtro-instituicao-responsavel"
          class="campo campo-select"
          formControlName="instituicaoResponsavel"
        >
          <option [ngValue]="null">Todas</option>
          @for (opcao of instituicoesResponsaveis; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-form rotulo="Instituição" paraId="filtro-instituicao">
        <select id="filtro-instituicao" class="campo campo-select" formControlName="instituicao">
          <option [ngValue]="null">Todas</option>
          @for (opcao of instituicoes; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-form rotulo="Situação Lote" paraId="filtro-situacao">
        <select id="filtro-situacao" class="campo campo-select" formControlName="situacao">
          @for (opcao of situacoes; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-faixa
        rotulo="ID Lote"
        tipo="inteiro"
        exemploDe="1001"
        exemploAte="1024"
        [grupo]="form.controls.idLote"
      />
      <app-campo-faixa
        rotulo="Valor Lote"
        tipo="decimal"
        prefixo="R$"
        exemploDe="0,00"
        exemploAte="999.999,99"
        [grupo]="form.controls.valor"
      />
      <app-campo-faixa rotulo="Data Entrada" tipo="data" [grupo]="form.controls.dataEntrada" />
    </div>

    <div class="mt-5 flex items-center justify-end gap-2">
      <button type="button" class="btn btn-texto" (click)="limpar()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        Limpar
      </button>

      <button type="submit" class="btn btn-primario" [disabled]="carregando()">
        @if (carregando()) {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            class="size-4 animate-spin motion-reduce:animate-none"
            aria-hidden="true"
          >
            <path d="M12 3a9 9 0 1 0 9 9" />
          </svg>
          Buscando…
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          Pesquisar
        }
      </button>
    </div>
  </form>
</app-painel-recolhivel>
