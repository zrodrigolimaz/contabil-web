<app-painel-recolhivel titulo="Filtros">
  <div resumo>
    @for (chip of chips(); track chip) {
      <span class="chip">{{ chip }}</span>
    }
  </div>

  <p class="eyebrow mb-5">Pesquisar lote outros créditos/débitos</p>

  <form [formGroup]="form" (ngSubmit)="aoEnviar()">
    <div class="grid gap-x-6 gap-y-6 md:grid-cols-2 xl:grid-cols-3">
      <app-campo-form rotulo="Instituição Resp." paraId="filtro-instituicao-responsavel">
        <select
          id="filtro-instituicao-responsavel"
          class="campo campo-select"
          formControlName="instituicaoResponsavel"
        >
          <option [ngValue]="null">Todas</option>
          @for (opcao of instituicoesResponsaveis; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-form rotulo="Instituição" paraId="filtro-instituicao">
        <select id="filtro-instituicao" class="campo campo-select" formControlName="instituicao">
          <option [ngValue]="null">Todas</option>
          @for (opcao of instituicoes; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-form rotulo="Situação Lote" paraId="filtro-situacao">
        <select id="filtro-situacao" class="campo campo-select" formControlName="situacao">
          @for (opcao of situacoes; track opcao) {
            <option [ngValue]="opcao">{{ opcao }}</option>
          }
        </select>
      </app-campo-form>

      <app-campo-faixa rotulo="ID Lote" tipo="inteiro" [grupo]="form.controls.idLote" />
      <app-campo-faixa rotulo="Valor Lote" tipo="decimal" [grupo]="form.controls.valor" />
      <app-campo-faixa rotulo="Data Entrada" tipo="data" [grupo]="form.controls.dataEntrada" />
    </div>

    <div class="mt-6 flex justify-end gap-1 border-t border-petrol-900/[0.12] pt-4">
      <button type="button" class="btn btn-texto" (click)="limpar()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        Limpar
      </button>

      <button type="submit" class="btn btn-primario">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        Pesquisar
      </button>
    </div>
  </form>
</app-painel-recolhivel>
