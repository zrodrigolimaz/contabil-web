<div class="flex flex-col gap-2">
  <!--
    Cada família ganha sua própria ilha: mesmo com quase tudo apagado, o olho lê
    três grupos de ação, e não sete botões quebrados.
  -->
  <div class="flex flex-wrap items-center gap-2" role="toolbar" aria-label="Ações sobre os lotes">
    @for (grupo of grupos(); track $index) {
      <div
        class="inline-flex gap-0.5 rounded-[9px] border border-petrol-900/[0.08] bg-surface p-[3px]"
      >
        @for (botao of grupo; track botao.acao) {
          <!--
            aria-disabled, e não disabled: o botão continua no caminho do teclado e o
            leitor de tela chega ao motivo do bloqueio, que a faixa abaixo explica.
          -->
          <button
            type="button"
            class="btn gap-1.5 rounded-[7px] px-2.5 py-1.5 text-[11.5px] aria-disabled:opacity-35"
            [class]="botao.destaque ? 'btn-primario' : botao.perigo ? 'btn-perigo' : 'btn-fantasma'"
            [attr.aria-disabled]="bloqueado(botao) ? 'true' : null"
            [attr.aria-describedby]="bloqueado(botao) ? idDica : null"
            [title]="botao.descricao"
            (click)="acionarBotao(botao)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-[13px] shrink-0"
              aria-hidden="true"
            >
              <path [attr.d]="botao.caminho" />
            </svg>
            {{ botao.rotulo }}
          </button>
        }
      </div>
    }
  </div>

  <!--
    A faixa fica sempre presente para a tabela não pular quando a primeira linha é
    marcada. A dica é visível, e não um title: quem olha o botão apagado precisa ler
    o motivo sem depender de passar o mouse por cima.
  -->
  <div class="flex min-h-6 flex-wrap items-center gap-2">
    @if (quantidade(); as total) {
      <span class="chip gap-1 pr-1">
        {{ total }} {{ total === 1 ? 'selecionado' : 'selecionados' }}

        <!-- A seleção atravessa páginas: sem isto não há como desfazer de uma vez. -->
        <button
          type="button"
          class="rounded-full p-0.5 text-primary-700/60 transition-colors hover:bg-primary-600/15 hover:text-primary-700 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-500 disabled:cursor-not-allowed disabled:opacity-40"
          [attr.aria-label]="rotuloLimpar()"
          [disabled]="executando()"
          (click)="limparSelecao.emit()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            class="size-[11px]"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </span>
    }

    @if (dica(); as texto) {
      <p [id]="idDica" class="text-[11px] text-petrol-700/80">{{ texto }}</p>
    }
  </div>
</div>
