<div class="flex min-h-screen bg-surface">
  <nav
    aria-label="Menu principal"
    class="flex shrink-0 flex-col border-r border-r-petrol-900/10 bg-white transition-[width] duration-200 motion-reduce:transition-none"
    [class]="menuRecolhido() ? 'w-[76px]' : 'w-72'"
  >
    <div
      class="flex h-[72px] border-b border-petrol-900/10 px-3"
      [class]="
        menuRecolhido()
          ? 'flex-col items-center justify-center gap-1'
          : 'flex-row items-center gap-2.5'
      "
    >
      <span class="grid size-9 shrink-0 place-items-center rounded-full bg-petrol-900 text-white">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true"
        >
          <path
            d="M12 6.5C10.5 5.5 8.5 5 6.5 5H4v13h2.5c2 0 4 .5 5.5 1.5 1.5-1 3.5-1.5 5.5-1.5H20V5h-2.5c-2 0-4 .5-5.5 1.5Z"
          />
          <path d="M12 6.5v13" />
        </svg>
      </span>
      @if (!menuRecolhido()) {
        <p class="min-w-0 flex-1 truncate text-sm font-bold text-petrol-900">Contábil Web</p>
      }
      <button
        type="button"
        aria-label="Alternar menu"
        [attr.aria-expanded]="!menuRecolhido()"
        (click)="menuRecolhido.set(!menuRecolhido())"
        class="grid size-8 shrink-0 place-items-center rounded-lg text-petrol-700 transition-colors hover:bg-petrol-900/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          class="size-5"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <ul class="flex flex-col gap-1 p-3">
      <li>
        <a
          href="#"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm text-petrol-800 transition-colors hover:bg-petrol-900/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
          [class.justify-center]="menuRecolhido()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-5 shrink-0"
            aria-hidden="true"
          >
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z" />
          </svg>
          @if (!menuRecolhido()) {
            <span>Início</span>
          }
        </a>
      </li>

      <li>
        <button
          type="button"
          aria-controls="submenu-contabil"
          [attr.aria-expanded]="grupoContabilAberto()"
          (click)="grupoContabilAberto.set(!grupoContabilAberto())"
          class="flex w-full items-center gap-3 rounded-xl bg-primary-50 px-3.5 py-2.5 text-sm font-semibold text-petrol-900 transition-colors hover:bg-primary-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
          [class.justify-center]="menuRecolhido()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-5 shrink-0 text-primary-700"
            aria-hidden="true"
          >
            <path
              d="M12 6.5C10.5 5.5 8.5 5 6.5 5H4v13h2.5c2 0 4 .5 5.5 1.5 1.5-1 3.5-1.5 5.5-1.5H20V5h-2.5c-2 0-4 .5-5.5 1.5Z"
            />
            <path d="M12 6.5v13" />
          </svg>
          @if (!menuRecolhido()) {
            <span class="flex-1 text-left">Contábil</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4 text-petrol-700/70 transition-transform motion-reduce:transition-none"
              [class.-rotate-90]="!grupoContabilAberto()"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          }
        </button>

        @if (grupoContabilAberto() && !menuRecolhido()) {
          <ul
            id="submenu-contabil"
            class="ml-[21px] mt-1 flex flex-col gap-1 border-l border-petrol-900/10 pl-2.5"
          >
            <li>
              <a
                href="#"
                aria-current="page"
                class="flex items-center gap-2.5 rounded-lg bg-primary-100/60 px-3 py-2 text-[13px] font-medium text-petrol-900 transition-colors hover:bg-primary-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="size-4 shrink-0 text-primary-700"
                  aria-hidden="true"
                >
                  <path d="m16 3 4 4-4 4" />
                  <path d="M20 7H4" />
                  <path d="m8 21-4-4 4-4" />
                  <path d="M4 17h16" />
                </svg>
                Outros Créditos/Débitos
              </a>
            </li>
          </ul>
        }
      </li>
    </ul>
  </nav>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex h-[72px] flex-col justify-center border-b border-petrol-900/10 bg-white px-7 shadow-[0_1px_2px_rgba(11,46,51,0.04)]"
    >
      <h1 class="text-lg font-semibold tracking-tight text-petrol-900">Outros Créditos/Débitos</h1>
      <nav aria-label="Trilha de navegação" class="mt-0.5">
        <ol class="flex items-center gap-1.5 text-[11px]">
          <li>
            <a
              href="#"
              class="text-primary-700 underline decoration-primary-300 underline-offset-2 transition-colors hover:text-primary-600 hover:decoration-primary-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
              >Início</a
            >
          </li>
          <li aria-hidden="true" class="text-petrol-700/50">›</li>
          <li aria-current="page" class="text-petrol-700/80">Outros Créditos/Débitos</li>
        </ol>
      </nav>
    </header>

    <!-- O shell fornece só o fundo; cada página compõe seus próprios cartões sobre ele. -->
    <main class="flex flex-1 flex-col p-5 sm:p-7">
      <router-outlet />
    </main>
  </div>
</div>
