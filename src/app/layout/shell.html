<div class="flex h-dvh overflow-hidden bg-surface">
  <nav
    aria-label="Menu principal"
    class="flex shrink-0 flex-col bg-petrol-900 transition-[width] duration-200 motion-reduce:transition-none"
    [class]="menuRecolhido() ? 'w-18' : 'w-66'"
  >
    <div
      class="flex h-16 shrink-0 border-b border-white/[0.08]"
      [class]="
        menuRecolhido()
          ? 'flex-col items-center justify-center gap-0.5 px-2'
          : 'flex-row items-center gap-3 px-5'
      "
    >
      <img
        src="sicoob.jpg"
        alt="Sicoob"
        class="size-8 shrink-0 rounded-lg object-cover"
        width="32"
        height="32"
      />

      @if (!menuRecolhido()) {
        <p class="min-w-0 flex-1 truncate font-display text-[15px] font-semibold text-white">
          Contábil <span class="text-primary-300">Web</span>
        </p>
      }

      @if (!telaEstreita()) {
        <button
          type="button"
          aria-label="Alternar menu"
          [attr.aria-expanded]="!menuRecolhido()"
          [title]="menuRecolhido() ? 'Expandir menu' : 'Recolher menu'"
          (click)="alternarMenu()"
          class="grid shrink-0 place-items-center rounded-lg text-white/55 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
          [class]="menuRecolhido() ? 'size-6' : 'size-8'"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
            [class]="menuRecolhido() ? 'size-4' : 'size-[18px]'"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      }
    </div>

    <ul class="flex flex-1 flex-col gap-0.5 overflow-y-auto p-3">
      <li>
        <a
          href="#"
          class="flex h-10 items-center gap-3 rounded-lg px-3 text-sm font-medium text-white/70 transition-colors hover:bg-white/[0.06] hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
          [class.justify-center]="menuRecolhido()"
          [title]="menuRecolhido() ? 'Início' : null"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-[17px] shrink-0"
            aria-hidden="true"
          >
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z" />
          </svg>
          @if (!menuRecolhido()) {
            <span>Início</span>
          }
        </a>
      </li>

      <li>
        <button
          type="button"
          aria-controls="submenu-contabil"
          [attr.aria-expanded]="grupoContabilAberto()"
          (click)="grupoContabilAberto.set(!grupoContabilAberto())"
          class="flex h-10 w-full items-center gap-3 rounded-lg px-3 text-sm font-medium text-white/85 transition-colors hover:bg-white/[0.06] hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
          [class.justify-center]="menuRecolhido()"
          [title]="menuRecolhido() ? 'Contábil' : null"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-[17px] shrink-0"
            aria-hidden="true"
          >
            <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2Z" />
            <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7Z" />
          </svg>
          @if (!menuRecolhido()) {
            <span class="flex-1 text-left">Contábil</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-[15px] text-white/50 transition-transform motion-reduce:transition-none"
              [class.rotate-180]="!grupoContabilAberto()"
              aria-hidden="true"
            >
              <path d="m18 15-6-6-6 6" />
            </svg>
          }
        </button>

        @if (grupoContabilAberto()) {
          <ul id="submenu-contabil" class="mt-0.5 flex flex-col gap-0.5">
            <li>
              <a
                href="#"
                aria-current="page"
                [title]="menuRecolhido() ? 'Outros Créditos/Débitos' : null"
                class="flex h-10 items-center rounded-lg bg-primary-500/15 text-[#7fe0d4] transition-colors hover:bg-primary-500/25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
                [class]="
                  menuRecolhido()
                    ? 'justify-center px-3'
                    : 'gap-[11px] pl-[23px] pr-3 text-[13.5px] font-semibold'
                "
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="size-4 shrink-0"
                  aria-hidden="true"
                >
                  <path d="M8 3 4 7l4 4" />
                  <path d="M4 7h16" />
                  <path d="m16 21 4-4-4-4" />
                  <path d="M20 17H4" />
                </svg>
                @if (!menuRecolhido()) {
                  Outros Créditos/Débitos
                }
              </a>
            </li>
          </ul>
        }
      </li>
    </ul>
  </nav>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <header
      class="flex h-16 shrink-0 items-center gap-4 border-b border-petrol-900/[0.08] bg-white px-5 sm:px-8"
    >
      <div class="flex min-w-0 flex-1 flex-col gap-[3px]">
        <h1 class="font-display text-[19px] font-bold tracking-[-0.01em] text-petrol-900">
          Outros Créditos/Débitos
        </h1>
        <nav aria-label="Trilha de navegação">
          <ol class="flex items-center text-xs text-muted">
            <li>
              <a
                href="#"
                class="font-medium text-primary-700 transition-colors hover:text-primary-600 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
                >Início</a
              >
            </li>
            <li aria-hidden="true" class="mx-1.5 text-[#9db0b2]">›</li>
            <li aria-current="page">Outros Créditos/Débitos</li>
          </ol>
        </nav>
      </div>
      <a
        href="https://github.com/zrodrigolimaz/contabil-web"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver o código no GitHub"
        title="Ver o código no GitHub"
        class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg border border-petrol-900/15 px-3 text-[13px] font-medium text-petrol-900/75 transition-colors hover:border-petrol-900/25 hover:bg-petrol-900/[0.04] hover:text-petrol-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="size-[18px]" aria-hidden="true">
          <path
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.35.95.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.26 5.66.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.67.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
          />
        </svg>
        <span class="hidden sm:inline">GitHub</span>
      </a>
    </header>

    <main class="flex flex-1 flex-col overflow-y-auto px-5 pb-8 pt-7 sm:px-8">
      <router-outlet />
    </main>
  </div>
</div>
